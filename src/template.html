<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="everything-container">
      <div id="title-div">Weza</div>
      <div id="search-div">
        <form id="search-form" autocomplete="off">
          <input
            type="search"
            id="search-input"
            name="search-input"
            placeholder="Enter your country"
          />
          <button type="submit" id="search-button">⌕</button>
        </form>
      </div>
      <div id="dropdown-div">
        <select id="day-select" disabled>
          <option value="0" selected>today</option>
          <option value="1">tomorrow</option>
          <option value="2">in two days</option>
          <option value="3">in three days</option>
          <option value="4">in 4 days</option>
        </select>
      </div>
      <div id="weather-div"></div>
    </div>
  </body>
</html>
